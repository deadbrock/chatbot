<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AstroChat - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
  <main class="auth-shell">
    <div class="auth-card">
      <div class="brand">
        <div class="brand-icon">
          <i class="bi bi-robot"></i>
        </div>
        <div>
          <div class="brand-title">AstroChat</div>
          <div class="brand-subtitle">Painel Administrativo - Aestron</div>
        </div>
      </div>

      <h1 class="auth-title">Entrar</h1>
      <p class="auth-hint">Use suas credenciais para acessar tickets, sessões e métricas em tempo real.</p>

      <form id="loginForm" class="mt-4" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input id="email" name="email" type="email" class="form-control" autocomplete="username" required placeholder="ex: admin@admin.com" />
          </div>
          <div class="invalid-feedback">Informe um e-mail válido.</div>
        </div>

        <div class="mb-2">
          <label for="password" class="form-label">Senha</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required placeholder="Sua senha" />
            <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Mostrar senha">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <div class="invalid-feedback">Informe sua senha.</div>
        </div>

        <div class="d-flex align-items-center justify-content-between mt-3 mb-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="1" id="rememberMe">
            <label class="form-check-label" for="rememberMe">
              Manter conectado
            </label>
          </div>
          <a class="auth-link" href="#" id="showDefaultCreds">Credenciais padrão</a>
        </div>

        <div class="d-grid gap-2">
          <button class="btn btn-primary btn-lg" type="submit" id="submitBtn">
            <span class="btn-text">Entrar</span>
            <span class="btn-spinner spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          </button>
        </div>

        <div class="alert alert-danger mt-3 d-none" id="errorBox"></div>
        <div class="alert alert-info mt-3 d-none" id="defaultCreds">
          <div><strong>E-mail:</strong> admin@admin.com</div>
          <div><strong>Senha:</strong> admin123</div>
        </div>
      </form>

      <div class="auth-footer">
        <span>Ambiente de desenvolvimento (SQLite local)</span>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
